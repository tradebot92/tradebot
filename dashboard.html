*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,system-ui,sans-serif;max-width:760px;margin:auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding-top:calc(14px + env(safe-area-inset-top))}
h1{font-size:20px;margin:0}
.maj{color:var(--sub);font-size:13px;margin:2px 0 10px}

nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
section{display:none}section.on{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
select,.lien{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.lien{text-decoration:none;color:var(--acc)}
details.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.card>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
.l1{font-weight:700}.l2{color:var(--sub);font-size:13px}
.r{text-align:right;white-space:nowrap}
.corps{padding:0 14px 14px;border-top:1px solid var(--line)}
.up{color:var(--ok)}.down{color:var(--ko)}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;border:1px solid var(--line);color:var(--sub)}
.tag.positif{color:var(--ok);border-color:var(--ok)}.tag.negatif{color:var(--ko);border-color:var(--ko)}
.tag.warn{color:var(--warn);background:var(--warnbg);border-color:transparent}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.hero{background:var(--accbg);border-color:transparent}
h3{font-size:14px;margin:14px 0 4px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.sm{font-size:14px;color:var(--sub)}
ul{margin:4px 0;padding-left:20px}li{margin:2px 0}
.fourch{display:flex;gap:8px;margin:8px 0}
.fourch div{flex:1;border-radius:8px;padding:8px;font-size:14px;background:var(--bg)}
.spark{width:100%;height:60px;display:block;margin:10px 0 2px}
.rng{position:relative;height:8px;border-radius:4px;background:var(--line);margin:22px 4px 6px}
.rng i{position:absolute;top:-4px;width:2px;height:16px;background:var(--sub)}
.rng b{position:absolute;top:-3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.rngl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
a{color:var(--acc)}
a.act{display:inline-block;text-decoration:none;border:1px solid var(--acc);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:10px;color:var(--acc)}
button.act{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;margin-top:10px}
button.del{border:none;background:none;color:var(--sub);cursor:pointer;font-size:18px}
.avert{font-size:12px;color:var(--sub);margin-top:18px}
.vide{color:var(--sub);text-align:center;padding:24px 0}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=n=>n==null||isNaN(n)?"n/a":(n>0?"+":"")+(Math.round(n*10)/10)+" %";
const cls=n=>n>0?"up":n<0?"down":"";
const arr=x=>Array.isArray(x)?x:(x?[x]:[]);
const mc=n=>n?(n>=1e9?(n/1e9).toFixed(1)+" Md":(n/1e6).toFixed(0)+" M"):"n/a";
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SENT={positif:"positif",neutre:"neutre",negatif:"négatif",inconnu:"non analysé"};
const byS=Object.fromEntries(D.fiches.map(f=>[f.symbole,f]));

/* ---- thème ---- */
const th=ls.get("tb_theme",null);if(th)document.documentElement.dataset.theme=th;
$("#theme").onclick=()=>{const d=document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);const n=d?"light":"dark";document.documentElement.dataset.theme=n;ls.set("tb_theme",n)};

/* ---- briques ---- */
function spark(f){const s=f.serie||[];if(s.length<3)return"";const mn=Math.min(...s),mx=Math.max(...s),r=(mx-mn)||1;
const pts=s.map((v,i)=>`${(i/(s.length-1)*100).toFixed(1)},${(28-(v-mn)/r*26).toFixed(1)}`).join(" ");
const c=f.perf_6m>=0?"var(--ok)":"var(--ko)";
return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>
<div class="rngl"><span>il y a 6 mois</span><span class="${cls(f.perf_6m)}">${pct(f.perf_6m)} sur 6 mois</span><span>aujourd'hui</span></div>`}
function analystes(f){const lo=f.objectif_bas,mo=f.objectif_moyen,hi=f.objectif_haut;if(!(lo&&hi&&hi>lo))return `<div class="sm">Objectifs des analystes : non disponibles.</div>`;
const p=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
return `<div class="rng"><i style="left:${p(mo)}%" title="moyen"></i><b style="left:${p(f.cours)}%" title="cours"></b></div>
<div class="rngl"><span>bas ${lo}</span><span>moyen ${Math.round(mo*100)/100}</span><span>haut ${hi}</span></div>
<div class="sm">Le rond = cours actuel (${f.cours}). ${f.nb_analystes?f.nb_analystes+" analystes, ":""}avis : ${esc(f.recommandation||"n/a")}.</div>`}
function fourch(f){const o=f.fourchette;return `<div class="fourch">
<div><b class="up">Favorable</b><br>${pct(o.gain[0])} à ${pct(o.gain[1])}</div>
<div><b class="down">Défavorable</b><br>${pct(o.perte[1])} à ${pct(o.perte[0])}</div></div>
<div class="sm">Estimation sur ~1 mois d'après la volatilité${o.ecart_objectif!=null?` et l'objectif moyen des analystes (${pct(o.ecart_objectif)} vs cours)`:""}. Pas une garantie : le cours peut sortir de la fourchette.</div>`}
function liste(t,a){a=arr(a);return a.length?`<h3>${t}</h3><ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
function profil(f){const r=[];if(f.vol_mois>20)r.push("très volatile");if(f.capitalisation&&f.capitalisation<1e9)r.push("petite capitalisation : peu d'échanges, écarts de prix possibles");if(f.decouverte)r.push("à vérifier : disponible sur Trade Republic ?");return r.length?`<p class="sm"><span class="tag warn">⚠ Profil</span> ${r.join(" · ")}</p>`:""}
const issue=(act,sym)=>D.depot?`https://github.com/${D.depot}/issues/new?title=${encodeURIComponent(act+" "+sym)}&body=${encodeURIComponent("Clique simplement sur « Submit new issue ». Le bot "+(act==="FAV"?"ajoutera ":"retirera ")+sym+" de ta liste de favoris dans quelques minutes.")}`:"";
function boutonFav(f){if(!D.depot)return"";return f.decouverte?`<a class="act" href="${issue("FAV",f.symbole)}" target="_blank" rel="noopener">★ Ajouter aux favoris</a>`:`<a class="act" href="${issue("DEL",f.symbole)}" target="_blank" rel="noopener">✕ Retirer des favoris</a>`}
function carte(f){const a=f.analyse||{};
return `<details class="card"><summary>
<div><div class="l1">${esc(f.symbole)} <span class="tag ${esc(a.sentiment)}">${SENT[a.sentiment]||"n/a"}</span>${f.nouveau?' <span class="tag warn">Nouveau</span>':''}</div><div class="l2">${esc(f.nom)}</div></div>
<div class="r"><div class="l1">${f.cours} ${esc(f.devise)}</div><div class="l2 ${cls(f.variation_jour)}">${pct(f.variation_jour)} · score ${f.score}</div></div></summary>
<div class="corps">
${f.raisons&&f.raisons.length?`<h3>Pourquoi elle est là</h3><ul>${f.raisons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}
${spark(f)}
<h3>Analyse</h3><p>${esc(a.resume||"")}</p>
${a.confiance?`<div class="sm">Confiance de l'analyse : ${esc(a.confiance)} · importance de l'actu : ${a.importance}/5</div>`:""}
${liste("Points forts",a.points_forts)}${liste("⚠ Risques",a.risques)}${liste("À venir",a.catalyseurs)}
${a.a_surveiller?`<h3>À surveiller</h3><p>${esc(a.a_surveiller)}</p>`:""}
${f.prochains_resultats?`<div class="sm">📅 Prochains résultats : ${esc(f.prochains_resultats)}</div>`:""}
<h3>Objectifs des analystes</h3>${analystes(f)}
<h3>Fourchette possible</h3>${fourch(f)}
${profil(f)}
<h3>À propos</h3><div class="sm">${esc([f.secteur,f.industrie,f.pays].filter(Boolean).join(" · "))} · capi ${mc(f.capitalisation)} · croissance du CA ${f.croissance_ca!=null?pct(f.croissance_ca*100):"n/a"}</div>
<p class="sm">${esc(f.activite||"")}</p>
<h3>Articles</h3>${f.articles.slice(0,5).map(x=>`<div class="sm">• <a href="${esc(x.lien)}" target="_blank" rel="noopener">${esc(x.titre)}</a></div>`).join("")||'<div class="sm">Aucun article.</div>'}
<button class="act" data-papier="${esc(f.symbole)}">＋ Suivre en papier</button> ${boutonFav(f)}
</div></details>`}

/* ---- listes avec tri / filtre ---- */
const TRIS={score:["Score",f=>f.score],jour:["Variation du jour",f=>f.variation_jour],perf:["Perf. 6 mois",f=>f.perf_6m],crois:["Croissance du CA",f=>f.croissance_ca??-1e9],ecart:["Écart vers objectif",f=>f.fourchette.ecart_objectif??-1e9]};
function liste_onglet(id,fiches,extra){const el=$("#"+id);const st=ls.get("tb_"+id,{tri:"score",pays:""});
const pays=[...new Set(fiches.map(f=>f.pays).filter(Boolean))].sort();
el.innerHTML=`<div class="bar">${extra||""}<select data-k="tri">${Object.entries(TRIS).map(([k,v])=>`<option value="${k}" ${st.tri===k?"selected":""}>Trier : ${v[0]}</option>`).join("")}</select>
<select data-k="pays"><option value="">Tous les pays</option>${pays.map(p=>`<option ${st.pays===p?"selected":""}>${esc(p)}</option>`).join("")}</select></div><div class="liste"></div>`;
const rendre=()=>{const l=fiches.filter(f=>!st.pays||f.pays===st.pays).sort((a,b)=>TRIS[st.tri][1](b)-TRIS[st.tri][1](a));
el.querySelector(".liste").innerHTML=l.map(carte).join("")||'<div class="vide">Rien à afficher.</div>'};
el.querySelectorAll("select").forEach(s=>s.onchange=()=>{st[s.dataset.k]=s.value;ls.set("tb_"+id,st);rendre()});rendre()}

/* ---- Aujourd'hui ---- */
function aujourdhui(){const s=D.synthese||{points:[]};
const pts=(s.points||[]).map(p=>`<div class="box"><div class="l1">${esc(p.symbole)} <span class="l2">${esc(p.nom||"")}</span></div><p>${esc(p.pourquoi)}</p>${p.a_surveiller?`<div class="sm">👀 ${esc(p.a_surveiller)}</div>`:""}</div>`).join("");
const resultats=D.fiches.filter(f=>f.prochains_resultats).sort((a,b)=>a.prochains_resultats.localeCompare(b.prochains_resultats)).slice(0,6);
const mv=[...D.fiches].sort((a,b)=>Math.abs(b.variation_jour)-Math.abs(a.variation_jour)).slice(0,4);
$("#auj").innerHTML=`<div class="box hero"><div class="l1">À regarder aujourd'hui</div><div class="sm">${esc(s.prudence||"Pistes à étudier, pas des recommandations.")}</div></div>
${pts||'<div class="vide">Pas encore de synthèse. Ajoute des favoris ou attends le prochain lancement du bot.</div>'}
<h3>Plus gros mouvements du jour</h3>
<div class="box">${mv.map(f=>`<div style="display:flex;justify-content:space-between"><span>${esc(f.symbole)} <span class="sm">${esc(f.nom)}</span></span><b class="${cls(f.variation_jour)}">${pct(f.variation_jour)}</b></div>`).join("")||"—"}</div>
<h3>Prochains résultats</h3>
<div class="box">${resultats.map(f=>`<div style="display:flex;justify-content:space-between"><span>${esc(f.symbole)}</span><span class="sm">${esc(f.prochains_resultats)}</span></div>`).join("")||'<span class="sm">Aucune date connue.</span>'}</div>`}

/* ---- Papier ---- */
function papier(){const pos=ls.get("tb_papier",[]);let tot=0,inv=0;
const lignes=pos.map((p,i)=>{const f=byS[p.s];const now=f?f.cours:null;const v=now?(now/p.entree-1)*100:null;const g=now?p.montant*(now/p.entree-1):null;if(g!=null){tot+=g;inv+=p.montant}
return `<div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="l1">${esc(p.s)}</div><div class="sm">${esc(p.date)} · entrée ${p.entree} · mise fictive ${p.montant} €</div></div>
<div class="r">${v==null?"n/a":`<div class="l1 ${cls(v)}">${pct(v)}</div><div class="sm ${cls(g)}">${g>0?"+":""}${g.toFixed(0)} €</div>`}<button class="del" data-del="${i}" title="Retirer">✕</button></div></div></div>`}).join("");
$("#pap").innerHTML=`<div class="box hero"><div class="l1">Portefeuille papier</div><div class="sm">De l'argent fictif pour tester le bot sans risque. Ajoute une action avec « Suivre en papier » sur sa fiche. Enregistré sur cet appareil seulement.</div>
${pos.length?`<p class="l1 ${cls(tot)}">Gain ou perte fictif : ${tot>0?"+":""}${tot.toFixed(0)} € ${inv?`(${pct(tot/inv*100)})`:""}</p>`:""}</div>
${lignes||'<div class="vide">Aucune position pour l\'instant.</div>'}`}
document.addEventListener("click",e=>{const a=e.target.closest("[data-papier]");if(a){const s=a.dataset.papier,f=byS[s];const m=parseFloat(prompt("Mise fictive en € pour "+s+" ?","1000"));if(!m||m<=0)return;
const pos=ls.get("tb_papier",[]);pos.push({s,entree:f.cours,montant:m,date:new Date().toLocaleDateString("fr-FR")});ls.set("tb_papier",pos);papier();a.textContent="✓ Ajouté au portefeuille papier";return}
const d=e.target.closest("[data-del]");if(d){const pos=ls.get("tb_papier",[]);pos.splice(+d.dataset.del,1);ls.set("tb_papier",pos);papier()}});

/* ---- Journal ---- */
function journal(){$("#jou").innerHTML=D.journal.map(j=>{const v=j.cours_actuel?Math.round((j.cours_actuel/j.cours-1)*1000)/10:null;
return `<div class="box"><div style="display:flex;justify-content:space-between"><b>${esc(j.symbole)}</b><span class="sm">${esc(j.date)}</span></div>
<div class="sm">Cours au signal : ${j.cours} · Prévu : ${pct(j.perte[1])} à ${pct(j.gain[1])}</div>
<div>Réel depuis : ${v==null?"n/a":`<b class="${cls(v)}">${pct(v)}</b>`}</div><p class="sm">${esc(j.resume)}</p></div>`}).join("")||'<div class="vide">Pas encore de signal. Il apparaît quand une actualité importante est détectée (clé API requise).</div>'}

/* ---- montage ---- */
$("#maj").textContent="Mis à jour : "+D.maj+" (heure de Paris)";
$("#avert").textContent=D.avertissement;
aujourdhui();
const lienFav=D.depot?`<a class="lien" href="https://github.com/${esc(D.depot)}/edit/main/watchlist.txt" target="_blank" rel="noopener">✎ Modifier mes favoris</a>`:"";
liste_onglet("fav",D.fiches.filter(f=>!f.decouverte),lienFav);
liste_onglet("pot",D.fiches);
if((D.sorties||[]).length)$("#pot").insertAdjacentHTML("beforeend",`<h3>Sorties récentes de la liste</h3><div class="box">${D.sorties.slice(0,10).map(x=>`<div style="display:flex;justify-content:space-between"><span>${esc(x.symbole)} <span class="sm">${esc(x.nom||"")}</span></span><span class="sm">${esc(x.date)}</span></div>`).join("")}</div>`);
papier();journal();
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
document.querySelectorAll("nav button,section").forEach(e=>e.classList.remove("on"));
b.classList.add("on");$("#"+b.dataset.t).classList.add("on");scrollTo(0,0)});
</script>
</body>
</html>
