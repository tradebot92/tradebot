$("#fav").innerHTML=D.fiches.filter(f=>!f.decouverte).map(f=>`<div class="card">${entete(f)}
<div class="sm">Analystes : ${esc(f.recommandation||"n/a")}${f.nb_analystes?` (${f.nb_analystes})`:""} · Actu : <span class="tag">${esc(f.analyse.sentiment)}</span></div>
${fourch(f)}${lienArts(f)}</div>`).join("")||"<p>Aucun favori. Ajoute des symboles dans watchlist.txt (l'onglet Potentiel montre les entreprises découvertes).</p>";
function risque(f){const r=[];if(f.vol_mois>20)r.push("très volatile");if(f.capitalisation&&f.capitalisation<1e9)r.push("petite capitalisation : peu d'échanges, écarts de prix possibles");if(f.decouverte)r.push("à vérifier : disponible sur Trade Republic ?");return r.length?`<p class="sm"><b>⚠ Profil :</b> ${r.join(" · ")}</p>`:""}
const mc=n=>n?(n>=1e9?(n/1e9).toFixed(1)+" Md":(n/1e6).toFixed(0)+" M"):"n/a";
const pots=[...D.fiches].sort((a,b)=>b.score-a.score);
$("#pot").innerHTML=pots.map(f=>`<div class="card">${entete(f)}
<div class="sm">${f.decouverte?'<span class="tag">Découverte</span> ':''}Capi : ${mc(f.capitalisation)} · croissance du CA : ${f.croissance_ca!=null?pct(Math.round(f.croissance_ca*1000)/10):"n/a"}</div>
<div class="sm">Score potentiel : <b>${f.score}</b> · importance de l'actu : ${f.analyse.importance}/5</div>
<p>${esc(f.analyse.resume)}</p>
<p class="sm"><b>⚠ Risques :</b> ${esc(f.analyse.risques||"non précisés")}</p>
${risque(f)}${fourch(f)}${lienArts(f)}</div>`).join("");
$("#jou").innerHTML=D.journal.map(j=>{const v=j.cours_actuel?Math.round((j.cours_actuel/j.cours-1)*1000)/10:null;
return `<div class="card"><div class="top"><b>${esc(j.symbole)}</b><span class="sm">${esc(j.date)}</span></div>
<div class="sm">Cours au signal : ${j.cours} · Prévu : ${pct(j.perte[1])} à ${pct(j.gain[1])}</div>
<div>Réel depuis : ${v==null?"n/a":`<b class="${cls(v)}">${pct(v)}</b>`}</div><p class="sm">${esc(j.resume)}</p></div>`}).join("")||"<p>Pas encore de signal enregistré.</p>";
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
document.querySelectorAll("nav button,section").forEach(e=>e.classList.remove("on"));
b.classList.add("on");$("#"+b.dataset.t).classList.add("on")});
</script>
</body>
</html>
